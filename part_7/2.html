<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Youtube Hitesh</title>
</head>
<body style="background-color: black; color: white;">
    
</body>
<script>

const div=document.createElement("div")
console.log(div);

div.className="main"
div.id=Math.round(Math.random() * 10 +1)
div.setAttribute("title","generated title")
div.style.backgroundColor="green"
div.style.padding="12px"
// div.innerText="Anish Sharma is learning a new skill"
// setAttribute is most optimized it directly change. rest first take the value then they overwrite the value like .classname,.innertext...

const addtext=document.createTextNode("Anish Sharma is learning a new skill")
div.appendChild(addtext)

document.body.appendChild(div)

</script>
</html>
